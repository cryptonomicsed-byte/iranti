[workspace]
resolver = "2"
members = ["crates/iranti-core", "crates/iranti-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Bino / Iranti Contributors"]

[workspace.dependencies]
# Matches block/buzz's pinned nostr crate so engram envelopes are byte-compatible.
nostr = { version = "0.44", features = ["nip44", "nip98"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
